name: http4s Steward

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency: steward

jobs:
  steward:
    runs-on: ubuntu-latest
    name: http4s Steward
    env:
      SBT_OPTS: -Xmx3G
    steps:
      - uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14
    
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: 207529
          private-key: ${{ secrets.STEWARD_PRIVATE_KEY }}
          owner: http4s

      - name: Launch Scala Steward
        uses: scala-steward-org/scala-steward-action@3e5cae868160200afda12b57c150e56cede989ab # v2.97.0
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          repos-file: 'repos.md'
          author-email: 106843772+http4s-steward[bot]@users.noreply.github.com
          author-name: http4s-steward[bot]
